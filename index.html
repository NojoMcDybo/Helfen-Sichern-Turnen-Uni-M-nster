<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helfen &amp; Sichern — Videosammlung Turnseminar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --chalk: #F6EFE3;        /* warmes Hallenlicht */
    --ink: #33261A;          /* dunkles Holzbraun */
    --matte: #8C5A2B;        /* Leder / Pauschenpferd */
    --matte-dark: #6E4520;
    --signal: #D98E32;       /* warmes Gold für Status & Fortschritt */
    --line: #E4D9C6;
    --card: #FFFDF8;
    --muted: #8A7B68;
    --radius: 14px;
    --head1: #3B2C1E; --head2: #33261A; --head3: #2C2015;
    --head-accent: #D8B47E; --head-sub: #CBB99F; --head-line: #5A4630;
  }
  /* Studienleistung: warmes Terrakotta */
  body.view-sl {
    --chalk: #F8F1E9;
    --ink: #3A2420;
    --matte: #AE5230;
    --matte-dark: #8C3F23;
    --signal: #E8935F;
    --line: #EBD9CB;
    --card: #FFFBF6;
    --muted: #97796A;
    --head1: #4A2C22; --head2: #3E241C; --head3: #341F18;
    --head-accent: #F0A67E; --head-sub: #D8B4A3; --head-line: #6E4434;
  }
  body, header, .card, .vorgaben, nav { transition: background-color 0.35s ease, background 0.35s ease, border-color 0.35s ease; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
  body {
    background: var(--chalk);
    color: var(--ink);
    font-family: 'Barlow', system-ui, sans-serif;
    line-height: 1.5;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(160deg, var(--head1) 0%, var(--head2) 60%, var(--head3) 100%);
    color: var(--chalk);
    padding: 44px 24px 36px;
  }
  .header-inner { max-width: 1100px; margin: 0 auto; }
  .eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 0.85rem;
    color: var(--head-accent);
  }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(2.4rem, 6vw, 4rem);
    line-height: 1;
    letter-spacing: 0.01em;
    margin: 6px 0 10px;
  }
  h1 .amp { color: var(--signal); }
  .header-sub { color: var(--head-sub); font-size: 0.95rem; max-width: 60ch; }

  /* Fortschritt */
  .progress-wrap { margin-top: 22px; max-width: 480px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-family: 'Barlow Condensed', sans-serif;
    text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 0.8rem; color: #D8B47E; margin-bottom: 6px;
  }
  .progress-bar {
    height: 8px; background: #4A3A28; border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: var(--signal);
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .view-tabs {
    display: flex; gap: 10px; margin-top: 24px;
  }
  .view-tabs button {
    border-color: var(--head-line) !important;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 1.05rem;
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid var(--head-line);
    background: transparent;
    color: var(--head-sub);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .view-tabs button:hover { color: #fff; }
  .view-tabs button.active {
    background: var(--signal);
    border-color: var(--signal);
    color: var(--head2);
  }
  .vorgaben {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 6px solid var(--signal);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 18px;
  }
  .vorgaben .vorgaben-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 0.78rem;
    color: var(--matte);
    margin-bottom: 4px;
  }
  .vorgaben p { font-size: 0.95rem; white-space: pre-line; }
  .vorgaben-liste {
    margin: 2px 0 0 18px;
    font-size: 0.92rem;
  }
  .vorgaben-liste li { margin-bottom: 3px; }
  .elemente-liste {
    margin: 2px 0 0 22px;
    font-size: 0.95rem;
  }
  .elemente-liste li { margin-bottom: 5px; padding-left: 4px; }
  .elemente-liste li::marker { font-weight: 600; color: var(--matte); }
  .sl-kern {
    font-weight: 600;
    font-size: 0.98rem;
    margin-bottom: 10px;
  }
  .sl-intro { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }
  .sl-allgemein { margin-bottom: 36px; }
  .pflicht-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 0.8rem;
    color: #fff; background: var(--matte);
    padding: 3px 12px; border-radius: 999px;
    align-self: center;
  }
  .tracklist {
    grid-column: 1 / -1;
    background: linear-gradient(170deg, var(--head1), var(--head2) 45%, var(--head3));
    border-radius: var(--radius);
    padding: 20px 22px;
    color: var(--chalk);
  }
  .tracklist-head h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 1.5rem; text-transform: uppercase;
  }
  .tracklist-hinweis { font-size: 0.85rem; color: var(--head-sub); margin-top: 2px; }
  .tracklist-player { margin-top: 14px; }
  .tracklist-player iframe {
    width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; display: block;
  }
  .tracks { list-style: none; margin-top: 14px; }
  .track {
    all: unset;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .track:hover, .track:focus-visible { background: rgba(255,255,255,0.08); }
  .track.active { background: rgba(255,255,255,0.14); }
  .track.active .track-titel { color: var(--signal); font-weight: 600; }
  .track-nr {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; color: var(--head-sub); text-align: center;
  }
  .track-titel { font-size: 0.95rem; }
  .track-play { text-align: center; color: var(--head-sub); font-size: 0.8rem; opacity: 0; transition: opacity 0.12s; }
  .track:hover .track-play, .track.active .track-play { opacity: 1; color: var(--signal); }
  .sl-videos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .sl-videos .card { box-shadow: 0 2px 10px rgba(51,38,26,0.06); }
  .video-slot.playlist-slot button.thumb {
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, var(--head1), var(--head1) 14px, var(--head2) 14px, var(--head2) 28px);
  }
  .video-slot.playlist-slot .pl-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 0.95rem; color: var(--chalk);
    background: rgba(51,38,26,0.85);
    padding: 8px 18px; border-radius: 999px;
    border: 1px solid var(--head-line);
  }
  /* ---------- Sticky Nav ---------- */
  nav {
    position: sticky; top: 0; z-index: 50;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 4px rgba(51,38,26,0.06);
  }
  .nav-inner {
    max-width: 1100px; margin: 0 auto;
    padding: 10px 24px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .card-geraet {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em;
    font-size: 0.72rem;
    color: var(--matte);
  }
  .chip.active { background: var(--matte); color: #fff; border-color: var(--matte); }
  .chip.active .count { color: #EBD9BC; }
  .chip {
    cursor: pointer;
    font: inherit;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 0.9rem;
    color: var(--ink);
    background: var(--chalk);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 14px;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .chip:hover, .chip:focus-visible { background: var(--matte); color: #fff; border-color: var(--matte); }
  .chip .count { color: var(--muted); font-weight: 600; margin-left: 4px; }
  .chip:hover .count, .chip:focus-visible .count { color: #EBD9BC; }
  .search-box { margin-left: auto; }
  .search-box input {
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--chalk);
    color: var(--ink);
    width: 200px;
    outline-offset: 2px;
  }
  .search-box input:focus-visible { outline: 2px solid var(--matte); }

  /* ---------- Sections ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  section { margin-bottom: 56px; scroll-margin-top: 70px; }
  .section-head {
    display: flex; align-items: baseline; gap: 14px;
    border-bottom: 6px solid var(--matte);
    padding-bottom: 6px;
    margin-bottom: 22px;
  }
  .section-head h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; text-transform: uppercase;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    letter-spacing: 0.02em;
  }
  .section-head .sec-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    color: var(--muted);
    font-size: 1rem;
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* ---------- Cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 2px 10px rgba(51,38,26,0.06);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card:hover {
    box-shadow: 0 6px 18px rgba(51,38,26,0.10);
    transform: translateY(-2px);
  }
  .video-slot {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #241A10;
  }
  .video-slot.no-video {
    display: flex; align-items: center; justify-content: center;
    background: repeating-linear-gradient(45deg, #EFE6D5, #EFE6D5 12px, #E9DEC9 12px, #E9DEC9 24px);
  }
  .video-slot.no-video span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 0.85rem; color: var(--muted);
    background: var(--card); padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line);
  }
  .video-slot button.thumb {
    all: unset;
    cursor: pointer;
    position: absolute; inset: 0;
    display: block; width: 100%; height: 100%;
  }
  .video-slot button.thumb:focus-visible { outline: 3px solid var(--signal); outline-offset: -3px; }
  .video-slot img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: opacity 0.15s;
  }
  .video-slot button.thumb:hover img { opacity: 0.85; }
  .play-badge {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 58px; height: 42px;
    background: rgba(51,38,26,0.85);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .play-badge::after {
    content: "";
    border-style: solid;
    border-width: 9px 0 9px 16px;
    border-color: transparent transparent transparent #fff;
    margin-left: 3px;
  }
  .video-slot button.thumb:hover .play-badge { background: var(--signal); }
  .video-slot iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }

  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .card-title-row { display: flex; align-items: flex-start; gap: 8px; }
  .card h3 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    line-height: 1.15;
    flex: 1;
  }
  .status-dot {
    flex-shrink: 0;
    width: 10px; height: 10px; border-radius: 50%;
    margin-top: 6px;
    background: var(--line);
  }
  .status-dot.done { background: var(--signal); }

  .field label {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
    font-size: 0.75rem;
    color: var(--matte);
    margin-bottom: 3px;
  }
  .field p { font-size: 0.92rem; white-space: pre-line; }
  .field p.empty {
    color: var(--muted);
    font-style: italic;
    font-size: 0.85rem;
  }
  .quelle {
    font-size: 0.72rem;
    color: var(--muted);
  }
  .yt-link {
    margin-top: auto;
    font-size: 0.8rem;
    color: var(--muted);
    text-decoration: none;
  }
  .yt-link:hover { color: var(--matte); text-decoration: underline; }

  .no-results {
    text-align: center; color: var(--muted); padding: 60px 0;
    font-size: 1rem; display: none;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 24px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .search-box { margin-left: 0; width: 100%; }
    .search-box input { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="eyebrow">Turnseminar · IFS Münster</div>
    <h1>Turnseminar</h1>
    <p class="header-sub">Helfen &amp; Sichern (Prüfung) und Studienleistung — alle Videos, Griffe und Vorgaben an einem Ort.</p>
    <div class="view-tabs" id="view-tabs">
      <button type="button" data-view="hs" class="active">Helfen &amp; Sichern</button>
      <button type="button" data-view="sl">Studienleistung</button>
    </div>
      </div>
</header>

<nav>
  <div class="nav-inner" id="nav-chips">
    <div class="search-box">
      <input type="search" id="search" placeholder="Element suchen …" aria-label="Videos durchsuchen">
    </div>
  </div>
</nav>

<main id="content"></main>
<main id="content-sl" hidden></main>
<p class="no-results" id="no-results">Kein Element gefunden. Tippfehler oder falsches Gerät?</p>

<footer>Videos: Playlist „Helfen und Sichern" · Struktur &amp; Beschreibungen: Noah</footer>

<script>
/* ==========================================================================
   DATEN — hier pflegst du alles.
   Pro Video ein Objekt:
     id:       YouTube-Video-ID (nicht anfassen)
     geraet:   Gerät/Kategorie (bestimmt die Gruppierung)
     titel:    Anzeigename
     ablauf:   Beschreibung des Ablaufs beim Helfen/Sichern ("" = noch offen)
     merkmale: Besondere Merkmale / worauf achten ("" = noch offen)
   Zeilenumbrüche in Texten mit \n. Reihenfolge innerhalb eines Geräts = Reihenfolge hier.
   ========================================================================== */
const VIDEOS = [
  // ---------- Boden ----------
  { id: "P0NiU8Nr5dw", geraet: "Boden", titel: "1 · Handstand abrollen",
    ablauf: "1. Zwei Helfer beidseits: ganzer Klammergriff am Oberschenkel.\n2. Übenden im Handstand halten – Zeit zur Orientierung geben.\n3. Kleiner Schritt in Rollrichtung, Beine mitnehmen (Vorverlagern des Körpers).\n4. Beim Abrollen die Beine oben halten → langsames, kontrolliertes Abrollen.",
    merkmale: "Aktives Entgegengehen, Zugreifen und Mitgehen. Das Obenhalten verhindert zu frühes Anhocken – nimmt dem Übenden aber das eigene Vorverlagern ab: Hilfe konsequent abbauen.",
    quelle: "Script van Bentem, Handstand abrollen" },
  { id: "BNHEPU33ejA", geraet: "Boden", titel: "2 · Rad in den Handstand",
    ablauf: "1. Helfer steht im Rücken des Übenden hinter der Turnlinie.\n2. Hände gekreuzt an Hüfte/Beckenkamm ansetzen (Griff löst sich mit der Drehung auf).\n3. Rotation über der Stützphase begleiten, Rumpf stützen.\n4. Bis zum sicheren Stand mitgehen.",
    merkmale: "Griff kreuzen, sonst verdrehen sich die Arme des Helfers. Hilfe nah am Rumpf (KSP) ansetzen, nicht an den Beinen. Vorstufe aus dem Script: Rad in den Seithandstand mit Klammergriff an den Oberschenkeln.",
    quelle: "Standardgriff + Script van Bentem (Rad-Vorübung)" },
  { id: "CnCs30cFPFk", geraet: "Boden", titel: "3 · Rolle rückwärts in den Handstand",
    ablauf: "1. Aus der Rolle rw. die Hände neben dem Kopf aufsetzen (Finger zu den Schultern).\n2. Helfer stehen seitlich, Blick zueinander.\n3. Im Moment des Überrollens: Beine senkrecht nach oben ziehen (Zughilfe Unterschenkel/Fußgelenke oder Klammergriff Oberschenkel).\n4. Handstand sichern, bis der Übende stabil steht.",
    merkmale: "Reihenfolge aus dem Script: erst dynamische Hüftstreckung (vor der Lotrechten!), dann Armstreckung – im Moment der Armstreckung muss die Hüfte gestreckt sein. Zug erst geben, wenn die Arme aktiv drücken, sonst Nackenbelastung.",
    quelle: "Script van Bentem (Felgbewegungen) + Standardgriff" },
  { id: "tFY30RneLko", geraet: "Boden", titel: "5 · Kippe in den Handstand",
    ablauf: "1. Übender nimmt die Kipplage ein, Helfer stehen seitlich bereit.\n2. Explosiver Kippstoß: Hüfte, Arme und BWS gleichzeitig strecken → KSP hebt über die Stützstellen.\n3. Helfer sichern den Handstand mit Klammergriff an den Oberschenkeln.",
    merkmale: "Der KSP muss während der gesamten Kippbewegung senkrecht über den Stützstellen bleiben; Beinspannung ist Voraussetzung für die Impulsübertragung.",
    quelle: "Script van Bentem (Kippbewegungen); Griff: Standard – mit Video abgleichen" },
  { id: "88aqVLqw_K8", geraet: "Boden", titel: "6 · Überschlag Zielübung (HSÜ vorwärts)",
    ablauf: "1. Zwei Helfer beidseits in Position gehen.\n2. Sobald die Hände aufsetzen: innere Hand stützt im LWS-Bereich (Finger zeigen zu den Füßen).\n3. Äußere Hand fasst im ½ Drehklammergriff den Oberarm nahe des Schultergelenks.\n4. Dreh-Zug-Schubhilfe durch den Überschlag geben.\n5. Mitgehen bis in den sicheren Stand.",
    merkmale: "Dem KSP entgegengehen, nicht erst tief fallen lassen. Bei guter Körperspannung können sich die Helfer die Hände reichen (Brücke) – dann mitgehen, nicht abbremsen. Fortgeschritten: 1/1 Klammergriff an den Oberarmen.",
    quelle: "Script van Bentem, Handstützüberschlag vw." },
  { id: "tgR8qActv3k", geraet: "Boden", titel: "8 · Flick Flack",
    ablauf: "1. Helfer kniet seitlich neben dem Übenden.\n2. Turnernahe Hand unter den unteren Rücken (LWS), turnerferne unter die Oberschenkelrückseite.\n3. Beim Absprung nach hinten-oben heben.\n4. Über die eigenen Hände drehen lassen (Dreh-Stützhilfe) und die Landung sichern.",
    merkmale: "Absprung geht nach hinten-oben aus der Rücklage. Die Hilfe muss die stützlose Phase komplett tragen können – bei Schülern grundsätzlich zu zweit helfen.",
    quelle: "Standardgriff (Gerling) – mit Video abgleichen" },
  { id: "2EAWjfjJdtE", geraet: "Boden", titel: "29 · Wandsalto",
    ablauf: "1. Übender steht ca. eine halbe Beinlänge vor der Wand/Sprossenwand.\n2. Zwei Helfer fassen im 1/1-Drehklammergriff rw. an den Oberarmen.\n3. Wand hochlaufen, bis die Hüfte über Schulterhöhe der Helfer ist.\n4. Abdrücken und rückwärts überschlagen.\n5. Griff erst im sicheren Stand lösen.",
    merkmale: "Der Griff wird bis zum sicheren Stand zu keinem Zeitpunkt gelöst. Ansatz des Drehklammergriffs rw. vorher separat üben.",
    quelle: "Script van Bentem, Salto rw. (Wandsalto)" },
  // ---------- Sprung ----------
  { id: "4SRr5AJiKec", geraet: "Sprung", titel: "23 · Hocke — Einführung Hilfestellung",
    ablauf: "1. Zwei Helfer positionieren sich an der Landeseite des Kastens.\n2. Griffansatz zuerst in Ruhe/Zeitlupe am Übenden üben.\n3. Beim Sprung: ganzen Klammergriff am Oberarm ansetzen, sobald die Hände stützen.\n4. Griff bis zur sicheren Landung halten, in Bewegungsrichtung mitgehen.",
    merkmale: "Gefahrenmomente bei Stützsprüngen (Bruckmann): mangelhafte Übungsstätte, unsachgemäße Absprunghilfen, unzureichende Hilfestellung, fehlende Selbsteinschätzung, fehlende Lernvoraussetzungen.",

/* ==========================================================================
   Ab hier: Rendering. Muss nicht angefasst werden.
   ========================================================================== */
const content = document.getElementById("content");
const navChips = document.getElementById("nav-chips");
const searchBox = document.getElementById("search");
let activeGeraet = null;

function nrOf(v) { const m = v.titel.match(/^(\d+)/); return m ? parseInt(m[1], 10) : 999; }

function fieldHTML(label, text) {
  const empty = !text.trim();
  return `<div class="field">
    <label>${label}</label>
    <p class="${empty ? "empty" : ""}">${empty ? "Noch offen — Beschreibung folgt." : text}</p>
  </div>`;
}

function thumbHTML(v) {
  return `<button class="thumb" aria-label="Video abspielen: ${v.titel}">
    <img loading="lazy" referrerpolicy="no-referrer"
         src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"
         onerror="if(!this.dataset.alt){this.dataset.alt=1;this.src='https://img.youtube.com/vi/${v.id}/mqdefault.jpg';}else{this.style.display='none';}"
         alt="Vorschaubild: ${v.titel}">
    <span class="play-badge"></span>
  </button>`;
}

function render() {
  const sorted = [...VIDEOS].sort((a, b) => nrOf(a) - nrOf(b));
  const sec = document.createElement("section");
  sec.innerHTML = `
    <div class="section-head">
      <h2>Elementeliste A+B</h2>
      <span class="sec-count">${sorted.length} Videos · ${new Set(sorted.map(nrOf)).size} Elemente</span>
    </div>
    <div class="grid">
      ${sorted.map(v => `
        <article class="card" data-geraet="${v.geraet}" data-search="${(v.geraet + " " + v.titel).toLowerCase()}">
          ${v.id ? `<div class="video-slot" data-id="${v.id}">${thumbHTML(v)}</div>` : `<div class="video-slot no-video"><span>Kein Video in der Playlist</span></div>`}
          <div class="card-body">
            <div class="card-geraet">${v.geraet}</div>
            <div class="card-title-row">
              <h3>${v.titel}</h3>
              <span class="status-dot ${v.ablauf.trim() && v.merkmale.trim() ? "done" : ""}"
                    title="${v.ablauf.trim() && v.merkmale.trim() ? "Beschreibung vollständig" : "Beschreibung offen"}"></span>
            </div>
            ${fieldHTML("Ablauf", v.ablauf)}
            ${fieldHTML("Besondere Merkmale", v.merkmale)}
            ${v.quelle ? `<p class="quelle">Quelle: ${v.quelle}</p>` : ""}
            ${v.id ? `<a class="yt-link" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Auf YouTube öffnen ↗</a>` : ""}
          </div>
        </article>
      `).join("")}
    </div>`;
  content.replaceChildren(sec);

  // Filter-Chips
  document.querySelectorAll(".chip").forEach(c => c.remove());
  const searchWrap = navChips.querySelector(".search-box");
  const geraete = [...new Set(VIDEOS.map(v => v.geraet))];
  const mkChip = (label, count, geraet) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (activeGeraet === geraet ? " active" : "");
    b.innerHTML = count == null ? label : `${label}<span class="count">${count}</span>`;
    b.addEventListener("click", () => { activeGeraet = geraet; render(); applyFilter(); });
    navChips.insertBefore(b, searchWrap);
  };
  mkChip("Alle", VIDEOS.length, null);
  geraete.forEach(g => mkChip(g, VIDEOS.filter(v => v.geraet === g).length, g));

  applyFilter();
}

function applyFilter() {
  const q = searchBox.value.trim().toLowerCase();
  let any = false;
  document.querySelectorAll(".card").forEach(card => {
    const hit = (!q || card.dataset.search.includes(q)) &&
                (!activeGeraet || card.dataset.geraet === activeGeraet);
    card.style.display = hit ? "" : "none";
    if (hit) any = true;
  });
  document.getElementById("no-results").style.display = any ? "none" : "block";
}

/* Click-to-Load: Thumbnail → Iframe erst bei Klick (beide Ansichten, Videos + Playlists) */
document.addEventListener("click", e => {
  const btn = e.target.closest("button.thumb");
  if (!btn) return;
  const slot = btn.closest(".video-slot");
  const id = slot.dataset.id, list = slot.dataset.list;
  const iframe = document.createElement("iframe");
  iframe.src = id
    ? `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0${list ? "&list=" + list : ""}`
    : `https://www.youtube-nocookie.com/embed/videoseries?list=${list}`;
  iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
  iframe.allowFullscreen = true;
  iframe.title = "YouTube-Video";
  slot.replaceChildren(iframe);
});

searchBox.addEventListener("input", applyFilter);

    ${STUDIENLEISTUNG.map(s => `
      <section>

        </div>
        <div class="sl-videos">
          ${s.videos.map(v => v.type === "video" ? `
            <article class="card">
              <div class="video-slot" data-id="${v.id}" data-list="${v.list || ""}">
                <button class="thumb" aria-label="Video abspielen: ${v.titel}">
                  <img loading="lazy" referrerpolicy="no-referrer"
                       src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg"
                       onerror="if(!this.dataset.alt){this.dataset.alt=1;this.src='https://img.youtube.com/vi/${v.id}/mqdefault.jpg';}else{this.style.display='none';}"
                       alt="Vorschaubild: ${v.titel}">
                  <span class="play-badge"></span>
                </button>
              </div>
              <div class="card-body">
                <div class="card-title-row"><h3>${v.titel}</h3></div>
                <a class="yt-link" href="https://www.youtube.com/watch?v=${v.id}${v.list ? "&list=" + v.list : ""}" target="_blank" rel="noopener">Auf YouTube öffnen ↗</a>

}

/* Tracklist: Klick auf Track lädt den Player oben in der Box */
document.addEventListener("click", e => {
  const btn = e.target.closest("button.track");
  if (!btn) return;
  const box = btn.closest(".tracklist");
  const player = box.querySelector(".tracklist-player");
  player.hidden = false;
  player.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${btn.dataset.trackId}?autoplay=1&rel=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="YouTube-Video"></iframe>`;
  box.querySelectorAll(".track").forEach(t => t.classList.toggle("active", t === btn));
  player.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

/* Tab-Wechsel */
document.getElementById("view-tabs").addEventListener("click", e => {
  const btn = e.target.closest("button[data-view]");
  if (!btn) return;
  document.querySelectorAll("#view-tabs button").forEach(b => b.classList.toggle("active", b === btn));
  const sl = btn.dataset.view === "sl";
  document.body.classList.toggle("view-sl", sl);
  document.getElementById("content").hidden = sl;
  document.getElementById("content-sl").hidden = !sl;
  document.querySelector("nav").style.display = sl ? "none" : "";
  window.scrollTo({ top: 0 });
});

renderSL();

render();
